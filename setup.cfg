[metadata]
name = cairn-lite
version = attr: cairn_lite.__version__
description = Pass work between AI agents through one shared handoff file
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/alexliu072903-bit/cairn-lite
project_urls =
    Source = https://github.com/alexliu072903-bit/cairn-lite
    Issues = https://github.com/alexliu072903-bit/cairn-lite/issues
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cairn = cairn_lite.cli:entrypoint
